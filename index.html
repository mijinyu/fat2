<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<!-- 배포 후 이전 화면이 캐시로 남지 않도록: HTML은 매번 재검증, CSS/JS는 ?v= 버전으로 무효화 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FAT 2급 문제풀이 · 92회 대비</title>
<link rel="stylesheet" href="css/style.css?v=20260814a">
</head>
<body>
<header class="app-header">
  <div class="wrap">
    <h1>FAT 2급 문제풀이 <span class="mini">92회 대비</span></h1>
    <p class="sub">기출(80~91회) + 심화 · 분개 집중연습</p>
  </div>
</header>

<!-- 상단 대탭 -->
<nav class="tabs wrap" id="mainTabs">
  <button class="tab active" data-tab="past">📚 기존문제 <small>(회차별)</small></button>
  <button class="tab" data-tab="deep">🔥 심화문제 <small>(이론·분개)</small></button>
</nav>

<!-- 필터바 -->
<section class="filters wrap" id="filters">
  <div class="filterRow">
    <span class="rlabel">유형</span>
    <div class="chips">
      <button class="chip active" data-kind="all">전체</button>
      <button class="chip" data-kind="theory">📝 이론</button>
      <button class="chip" data-kind="journal">✍️ 분개</button>
      <button class="chip" data-kind="close">🧾 결산</button>
    </div>
  </div>
  <div class="filterRow">
    <span class="rlabel">출제빈도</span>
    <div class="chips">
      <button class="chip active" data-star="0">전체</button>
      <button class="chip" data-star="1">⭐ 이상</button>
      <button class="chip" data-star="2">⭐⭐ 이상</button>
      <button class="chip" data-star="3">⭐⭐⭐</button>
    </div>
  </div>
  <div class="filterRow">
    <span class="rlabel">예상</span>
    <div class="chips">
      <button class="chip active" data-heart="0">전체</button>
      <button class="chip" data-heart="1">❤️ 92회 예상</button>
    </div>
  </div>
  <div class="filterRow" id="roundRow">
    <span class="rlabel">회차</span>
    <select id="roundSelect">
      <option value="all">전체 회차</option>
    </select>
  </div>
</section>

<main class="wrap" id="quizArea"></main>

<div class="floatbar">
  <span id="scoreText">푼 문제 0 · 정답 0</span>
  <button id="resetBtn" title="풀이 기록 초기화">기록 초기화</button>
</div>

<footer class="app-footer wrap">
  <p class="tiny">한국공인회계사회 FAT 2급 기출문제(제80~91회) 기반 · 개인 학습용</p>
</footer>

<script src="js/data.js?v=20260814a"></script>
<script src="js/app.js?v=20260814a"></script>
</body>
</html>
